# Install: pre-commit install
# Run manually: pre-commit run --all-files
# See https://pre-commit.com

default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--config, backend/pyproject.toml]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff (format)
        args: [--config, backend/pyproject.toml]
        files: ^backend/.*\.py$

