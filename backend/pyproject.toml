[project]
name = "commodity-forecasting-lab-backend"
version = "1.0.0"
description = "FastAPI backend for Commodity Forecasting Lab"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "UP",  # pyupgrade
]
ignore = [
    "D100",  # Missing module docstring (optional; remove to enforce)
    "D103",  # Missing docstring in public function (tests often omit)
    "D104",  # Missing docstring in public package
    "F403",  # Star imports in __init__.py (intentional re-exports)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
